<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Swap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="roomswap">     
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><p class="eyebrow"></p><h2 style="margin:0;font-size:1.1rem;">Room Exchange</h2></div>
      <nav class="nav-links">
        <a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
        <a href="mess-menu.html"><span class="nav-icon">🍽</span> Mess Menu</a>
        <a href="complaint.html"><span class="nav-icon">🛠</span> Complaints</a>
        <a href="gatepass.html"><span class="nav-icon">🚪</span> Gate Pass</a>
        <a href="leave.html"><span class="nav-icon">🗓</span> Leave</a>
        <a href="roomswap.html" class="active"><span class="nav-icon">🛏</span> Room Swap</a>
        <a href="holidays.html"><span class="nav-icon">📅</span> Holidays</a>
        <a href="feedback.html"><span class="nav-icon">⭐</span> Food Feedback</a>
      </nav>
      <div class="sidebar-footer"><a href="login.html" class="action-btn secondary-btn" style="width:100%;justify-content:center;border-radius:14px;">🚪 Logout</a></div>
    </aside>
    <main class="content-area two-col">
      <section class="panel">
        <p class="eyebrow">Swap Request</p>
        <h1>Room Swap</h1>
        <p class="panel-note">Submit a room change request. Admin will review and approve based on availability.</p>
        <form id="roomSwapForm" class="stack-form">
          <label><span>Current Room Number</span><input type="text" name="currentRoomNumber" id="rsCurrentRoom" placeholder="Auto-filled" readonly style="opacity:0.7;cursor:not-allowed;"></label>
          <label><span>Requested Room Number</span><input type="text" name="requestedRoomNumber" placeholder="e.g. B-101" required></label>
          <label><span>Reason for Swap</span><textarea name="reason" rows="4" placeholder="Why do you want to change rooms?" required></textarea></label>
          <button type="submit" class="primary-btn" style="justify-content:center;">🛏 Send Request</button>
        </form>
        <p id="roomSwapMessage" class="inline-message"></p>
      </section>
      <section class="panel">
        <p class="eyebrow">Status Board</p>
        <h2>Swap Requests</h2>
        <div id="roomSwapList" class="feed-list"></div>
      </section>
    </main>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
